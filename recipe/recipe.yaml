# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.3.2"
  python_check_max: "3.15"

package:
  name: devpi-process
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/devpi-process/devpi_process-${{ version }}.tar.gz
  sha256: e95929aff5bc1c24913fb715fcc87027024af9a5077d73bead4e16494719a010

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - hatch-vcs >=0.5
    - hatchling >=1.32.4
    - pip
    - python ${{ python_min }}.*
  run:
    - devpi-client >=7.3
    - devpi-server >=6.20.3
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      site_packages:
        - devpi_process/**
        - devpi_process-${{ version }}.dist-info/**
  - python:
      imports: devpi_process
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*

about:
  summary: devpi process provides a programmatic API to create and use a devpi server process
  license: MIT
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/devpi-process
  repository: https://github.com/tox-dev/devpi-process

extra:
  recipe-maintainers:
    - bollwyvl
